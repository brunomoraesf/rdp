<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Diário de Processos.exe</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style></style>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <div id="statusPopup"></div>

    <!-- Modal de erro (apenas OK) -->
    <div id="modalErroOverlay" class="overlay" style="z-index: 15000;">
        <div style="width: 90%; max-width: 300px; background: #ECE9D8; border: 1px solid #003399;">
            <div class="title-bar">
                <span>Erro</span>
                <div class="title-bar-controls">
                    <button onclick="fecharModalErro()"
                        style="background:linear-gradient(to bottom, #f2a08d, #e81123); color:white;">X</button>
                </div>
            </div>
            <div style="padding: 20px; text-align: center; font-size: 12px;" id="modalErroTexto"></div>
            <div style="padding: 10px; text-align: center;">
                <button onclick="fecharModalErro()">OK</button>
            </div>
        </div>
    </div>

    <div id="modalConfirmaOverlay" class="overlay" style="z-index: 15000;">
        <div style="width: 90%; max-width: 300px; background: #ECE9D8; border: 1px solid #003399;">
            <div class="title-bar">
                <span id="confirmaTitulo">Confirmar</span>
                <div class="title-bar-controls">
                    <button onclick="fecharConfirma()"
                        style="background:linear-gradient(to bottom, #f2a08d, #e81123); color:white;">X</button>
                </div>
            </div>
            <div style="padding: 20px; text-align: center; font-size: 12px;" id="confirmaTexto"></div>
            <div style="padding: 10px; text-align: center; display: flex; justify-content: center; gap: 10px;">
                <button id="btnConfirmaSim">Sim</button>
                <button id="btnConfirmaNao">Não</button>
                <button id="btnConfirmaCancelar">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="modalNotaOverlay" class="overlay">
        <div style="width: 95%; max-width: 550px; background: #ECE9D8; border: 1px solid #003399;">
            <div class="title-bar">
                <span id="notaTitulo">Bloco de Notas</span>
                <div class="title-bar-controls">
                    <button style="background:linear-gradient(to bottom, #f2a08d, #e81123); color:white;"
                        onclick="tentarFecharNota()">X</button>
                </div>
            </div>
            <div class="toolbar-nota">
                <button onclick="format('bold')"><b>B</b></button>
                <button onclick="format('italic')"><i>I</i></button>
                <button onclick="format('underline')"><u>U</u></button>
                <button onclick="changeCase('upper')">AA</button>
                <button onclick="changeCase('lower')">aa</button>
                <button onclick="format('backColor', '#ffff00')" style="background:yellow;"></button>
                <button onclick="format('backColor', '#FFCCCC')" style="background:#FFCCCC;"></button>
                <button onclick="format('backColor', '#CCFFCC')" style="background:#CCFFCC;"></button>
                <button onclick="format('backColor', '#CCE5FF')" style="background:#CCE5FF;"></button>
                <button onclick="format('backColor', 'transparent')" style="background:white"
                    title="Tirar Marcação">⬜</button>
                <button onclick="limparConteudo()" title="Limpar Tudo">🗑️</button>
            </div>
            <div id="notaEditable" class="nota-editable" contenteditable="true"></div>
            <div style="padding: 10px; text-align: center; display: flex; justify-content: center; gap: 10px;">
                <button onclick="tentarSalvarNota()">Salvar</button>
                <button onclick="tentarFecharNota()">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="modalPesquisaOverlay" class="overlay">
        <div style="width: 90%; max-width: 450px; background: #ECE9D8; border: 1px solid #003399;">
            <div class="title-bar">
                <span>Pesquisar Processo / Matrícula</span>
                <div class="title-bar-controls">
                    <button style="background:linear-gradient(to bottom, #f2a08d, #e81123); color:white;"
                        onclick="fecharPesquisa()">X</button>
                </div>
            </div>
            <div style="padding: 15px;">
                <label>Digite o número do processo ou matrícula (ex: 01234567 ou 1234567X):</label>
                <input type="text" id="inputBusca" placeholder="Processo ou matrícula" style="margin-top:5px;">
                <button onclick="executarPesquisa()" style="width: 100%; margin-top: 5px;">Localizar</button>
                <div id="resultadoBusca"
                    style="margin-top: 15px; max-height: 200px; overflow-y: auto; background: white; border: 1px solid #7F9DB9; padding: 5px; display: none;">
                </div>
            </div>
        </div>
    </div>

    <div id="modalChecklistOverlay" class="overlay">
        <div class="modal-checklist-container">
            <div class="title-bar">
                <span id="checklistTitulo">Checklist de Documentos</span>
                <div class="title-bar-controls">
                    <button onclick="fecharModalChecklist()"
                        style="background:linear-gradient(to bottom, #f2a08d, #e81123); color:white;">X</button>
                </div>
            </div>
            <div class="modal-checklist-body" id="checklistBody">
            </div>
        </div>
    </div>

    <div class="window">
        <div class="title-bar">
            <span>Registro Diário de Processos.exe</span>
            <div class="title-bar-controls">
                <button onclick="window.open('#')" disabled>✨</button>
                <button onclick="window.open('#')" disabled>🧙‍♂️</button>
                <button onclick="window.open('#')" disabled>📜</button>
                <button onclick="window.open('#')" disabled><i class="fa fa-info" aria-hidden="true"></i></button>
                <button onclick="window.open('#')" disabled>❓</button>
                <button onclick="carregarFraseClippy()">💬</button>
                <button onclick="abrirPesquisa()">🔍</button>
                <button style="background:linear-gradient(to bottom, #f2a08d, #e81123); color:white;">X</button>
            </div>
        </div>

        <div class="layout">
            <div class="esquerda">
                <fieldset>
                    <legend>Novo Registro</legend>
                    <label>Processo</label><input type="text" id="processo" placeholder="00000-00000000/0000-00">
                    <label>Tipo</label>
                    <select id="tipo">
                        <option value="abono">abono</option>
                        <option value="aposentadoria">aposentadoria</option>
                        <option value="invalidez">invalidez</option>
                        <option value="registros">registros</option>
                        <option value="outros">outros</option>
                    </select>
                    <div style="margin-bottom:10px;">
                        <label><input type="radio" name="fluxo" value="novo" checked> novo</label>
                        <label style="margin-left:10px;"><input type="radio" name="fluxo" value="atualizacao">
                            atualização</label>
                        <label style="margin-left:10px;"><input type="radio" name="fluxo" value="retorno">
                            retorno</label>
                    </div>
                    <button id="btnAdicionar" onclick="adicionarRegistro()">Adicionar</button>
                </fieldset>

                <fieldset>
                    <legend>Calendário</legend>
                    <div class="calendario" id="calendario"></div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px; margin-top:10px;">
                        <button onclick="forcarSalvar()" style="grid-column: span 2;">💾 Salvar no navegador</button>
                        <button onclick="gerarBackup()">Backup TXT</button>
                        <label
                            style="background: linear-gradient(to bottom, #ffffff 0%, #ebebe4 45%, #d1d1c9 50%, #ebebe4 100%); border:1px solid #003c74; padding:4px; text-align:center; border-radius:3px; cursor:pointer">
                            Carregar <input type="file" onchange="carregarBackup(this)" style="display:none">
                        </label>
                    </div>
                </fieldset>
            </div>

            <div class="direita">
                <h3 id="tituloDia"
                    style="margin-top:0; margin-bottom:0; color:#003399; border-bottom: 1px solid #D1D1B4; padding-bottom:5px;">
                </h3>
                <div id="listaRegistros"></div>
            </div>
        </div>

        <div class="status-bar">
            <div class="clippy-area">
                <img id="clippy-img" src="imagens/clippy-01.gif" alt="Clippy" class="clippy-img">
                <span id="frase-clippy">Carregando conselho...</span>
            </div>
            <div class="copyright-area">
                <a href="https://bmfolio.web.app/" target="_blank">© <span id="ano-atual">2026</span> Bruno Moraes</a>
                <a href="#">AGPL-3.0 license</a>
                <a href="#">Armazenamento local</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
